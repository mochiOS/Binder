[workspace]
members = [
    ".",
    "crates/binder_protocol",
]

[package]
name = "binder"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = ["develop"]
develop = []
mochios = []

[dependencies]
viewkit = "1.0.1"
binder_client = { git = "https://github.com/mochiOS/Binder", package = "binder_client" }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "mochios")'.dependencies]
mochi-user-syscall = { git = "https://github.com/mochiOS/syscalls", package = "mochi-user-syscall" }
