[workspace]
members = [
    ".",
    "crates/binder_protocol",
]

[package]
name = "binder"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = ["develop"]
develop = []
mochios = []

[dependencies]
serde_json = "1"
appcore = { package = "mochios-appcore", git = "https://github.com/mochiOS/devkit", default-features = false }
viewkit = { version = "2.0.0", git = "https://github.com/mochiOS/viewkit", rev = "78830e4eb6536cf498dad9206bc5da8b39123892" }
binder_client = { git = "https://github.com/mochiOS/Binder", package = "binder_client" }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "mochios")'.dependencies]
mochios-posix-client = { git = "https://github.com/mochiOS/syscalls", package = "mochios-posix-client", default-features = false, features = ["syscall-endpoint"] }
mochi-user-platform = { git = "https://github.com/mochiOS/syscalls", package = "mochi-user-platform", default-features = false, features = ["std", "mboot-wifi"] }
mochios-posix-protocol = { git = "https://github.com/mochiOS/syscalls", package = "mochios-posix-protocol" }
mochi-user-syscall = { git = "https://github.com/mochiOS/syscalls", package = "mochi-user-syscall" }
mochios-linux-gui-protocol = { git = "https://github.com/mochiOS/syscalls", rev = "814cb3f1f5e0dab5fc199f1de5a443bd61fe566e", package = "mochios-linux-gui-protocol" }
